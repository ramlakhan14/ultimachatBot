name: ultimachatbot-local

services:
  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data-local:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file: .env.local
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DBNAME: ultimachatbot_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  crawler-worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: ["node", "dist/crawler.main.js"]
    env_file: .env.local
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DBNAME: ultimachatbot_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  python-worker:
    build:
      context: ./workers
      dockerfile: Dockerfile.local
    env_file: .env.local
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DBNAME: ultimachatbot_local
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  seed-users:
    build:
      context: .
      dockerfile: Dockerfile.local
    command: ["npm", "run", "seed:local"]
    env_file: .env.local
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DBNAME: ultimachatbot_local
    depends_on:
      mongodb:
        condition: service_healthy
    profiles: ["seed"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.local
      args:
        REACT_APP_BASE_URL: ${REACT_APP_BASE_URL:-http://localhost:3000/}
        REACT_APP_SELF_HOST: ${REACT_APP_SELF_HOST:-true}
        REACT_APP_ENCRYPTION_DECRYPTION_KEY: ${REACT_APP_ENCRYPTION_DECRYPTION_KEY:-dummy}
        REACT_APP_GOOGLE_AUTH_ID: ${REACT_APP_GOOGLE_AUTH_ID:-dummy}
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY:-dummy}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN:-localhost}
        REACT_APP_FIREBASE_PROJECT_ID: ${REACT_APP_FIREBASE_PROJECT_ID:-local-only}
        REACT_APP_FIREBASE_STORAGE_BUCKET: ${REACT_APP_FIREBASE_STORAGE_BUCKET:-local-only}
        REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${REACT_APP_FIREBASE_MESSAGING_SENDER_ID:-000000000000}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID:-local-only}
        REACT_APP_FIREBASE_MEASUREMENT_ID: ${REACT_APP_FIREBASE_MEASUREMENT_ID:-dummy}
        REACT_APP_FIREBASE_VAPID_KEY: ${REACT_APP_FIREBASE_VAPID_KEY:-dummy}
    ports:
      - "127.0.0.1:3030:80"
    volumes:
      - ./frontend/public/firebase-messaging-sw.local.js:/usr/share/nginx/html/firebase-messaging-sw.js:ro
    depends_on:
      - backend

volumes:
  mongodb-data-local: